[project]
name = "plumb"
version = "0.1.0"
description = "Settlement assurance engine for Razorpay Route platforms"
readme = "README.md"
authors = [
    { name = "Melove Gupta", email = "melovegupta0406@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typer",
    "polars",
]

[project.scripts]
plumb-gen = "plumb_gen.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumb", "src/plumb_gen", "src/plumb_eval"]
